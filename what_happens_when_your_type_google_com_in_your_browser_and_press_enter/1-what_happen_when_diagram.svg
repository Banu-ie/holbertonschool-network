<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Request flow for https://www.google.com</title>
<desc>A browser resolves the domain via DNS, connects over TCP/IP on port 443 with HTTPS encryption, passes through a firewall, is distributed by a load balancer to a web server, which is served by an application server that queries a database.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="260" y="20" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
<text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">types www.google.com</text>

<text x="480" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">1. DNS lookup</text>
<line x1="420" y1="45" x2="580" y2="45" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="500" y="20" width="140" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="570" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#412402">DNS server</text>
<text x="570" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">resolves to IP</text>

<line x1="340" y1="70" x2="340" y2="118" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">2. TCP/IP + HTTPS (port 443)</text>

<rect x="230" y="120" width="220" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">SSL/TLS handshake</text>
<text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">traffic now encrypted</text>

<line x1="340" y1="170" x2="340" y2="198" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="200" width="160" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Firewall</text>
<text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">allows TCP/443</text>

<line x1="340" y1="250" x2="340" y2="278" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="280" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#412402">Load balancer</text>
<text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">distributes the request</text>

<line x1="340" y1="330" x2="340" y2="358" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="360" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Web server</text>
<text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">serves the page</text>

<line x1="340" y1="410" x2="340" y2="438" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="440" width="200" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Application server</text>
<text x="340" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">generates the page</text>

<line x1="340" y1="490" x2="340" y2="518" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="520" width="160" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="540" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Database</text>
<text x="340" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">supplies the data</text>

<text x="340" y="595" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Response travels back up the same path to the browser</text>
</svg>
